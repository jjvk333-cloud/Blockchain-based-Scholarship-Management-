# Server Configuration
server.port=${SERVER_PORT:8080}

# Spring Application Name
spring.application.name=scholartrust

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scholartrust_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:venkat123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${UPLOAD_DIR:uploads/documents}

# JWT Security Settings
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Blockchain / Web3j Configuration (Local Ganache)
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0xD833215cBcc3f914bD1C9ece3EE7BF8B14f841bb}
blockchain.admin-private-key=${BLOCKCHAIN_ADMIN_PRIVATE_KEY:0x4f3edf983ac636a65a842ce7c78d9aa706d3b113bce9c46f30d7d21715b23b1d}