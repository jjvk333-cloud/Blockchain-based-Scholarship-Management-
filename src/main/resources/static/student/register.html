<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Register — ScholarTrust</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>🎓 ScholarTrust</h1>
      <p>Create your student account</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="regForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="student@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/student/login.html">Login here</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert('alert');
      setLoading('submitBtn', true, 'Create Account');

      const res = await API.post('/api/auth/register', {
        fullName: document.getElementById('fullName').value.trim(),
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        role:     'ROLE_STUDENT'
      }).catch(() => null);

      setLoading('submitBtn', false, 'Create Account');

      if (!res || !res.success) {
        showAlert('alert', res?.message || 'Registration failed. Try again.', 'error');
        return;
      }
      showAlert('alert', '✅ Account created! Redirecting to login…', 'success');
      setTimeout(() => window.location.href = '/student/login.html', 1800);
    });
  </script>
</body>
</html>
