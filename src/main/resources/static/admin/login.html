<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ScholarTrust</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>🛡️ ScholarTrust</h1>
      <p>Administrator Portal</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@scholartrust.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Admin Login</button>
    </form>

    <div class="auth-footer">
      Student? <a href="/student/login.html">Go to Student Portal</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (function() {
      const u = API.user();
      const role = (u?.role || '').replace('ROLE_', '').toUpperCase();
      if (u && role === 'ADMIN' && API.token()) {
        window.location.href = '/admin/dashboard.html';
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert('alert');
      setLoading('submitBtn', true, 'Admin Login');

      const res = await API.post('/api/auth/login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      }).catch(() => null);

      setLoading('submitBtn', false, 'Admin Login');

      if (!res || !res.success) {
        showAlert('alert', res?.message || 'Login failed. Check credentials.', 'error');
        return;
      }
      const role = (res.data?.role || '').replace('ROLE_', '').toUpperCase();
      if (role !== 'ADMIN') {
        showAlert('alert', 'Access denied. Admin credentials required. Please use the <a href="/student/login.html">Student Portal</a>.', 'error');
        return;
      }
      API.setSession(res.data.token, res.data);
      window.location.href = '/admin/dashboard.html';
    });
  </script>
</body>
</html>
